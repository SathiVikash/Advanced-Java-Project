# ============================================================
#   APPLICATION CONFIG - Supply Chain Traceability System
# ============================================================
spring.application.name=supply-chain-traceability
server.port=9090

# Import local configuration if present (contains local secrets, ignored by git)
spring.config.import=optional:file:./application-local.properties

# ============================================================
#   JSP VIEW RESOLVER
# ============================================================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ============================================================
#   DATABASE: Embedded H2 (Zero external dependencies)
# ============================================================
spring.datasource.url=jdbc:h2:mem:supply_chain_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
#   ALTERNATIVE: MYSQL DATABASE (Uncomment if using XAMPP MySQL)
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/supply_chain_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#   HIBERNATE / JPA
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
#   BLOCKCHAIN - ETHEREUM SEPOLIA
# ============================================================
blockchain.rpc.url=${BLOCKCHAIN_RPC_URL:https://sepolia.infura.io/v3/YOUR_INFURA_API_KEY}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x7eF35D86ba45411EaA138d9618A872a83aAf137D}
blockchain.wallet.private-key=${BLOCKCHAIN_PRIVATE_KEY:YOUR_PRIVATE_KEY_WITHOUT_0x}
blockchain.chain.id=11155111

# Gas settings
blockchain.gas.limit=3000000
blockchain.gas.price=20000000000

# ============================================================
#   LOGGING
# ============================================================
logging.level.com.supplychain=DEBUG
logging.level.org.web3j=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO
